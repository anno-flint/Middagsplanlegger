<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middagsplanlegger</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #2f7d5b;
    --accent-dark: #24614a;
    --danger: #c0392b;
    --border: #e6e1d8;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.8rem; margin: 12px 0 4px; }
  h2 { font-size: 1.3rem; margin: 0 0 12px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 20px;
  }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    min-height: 48px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button:hover { background: var(--accent-dark); }
  button.secondary { background: #ece7de; color: var(--text); }
  button.secondary:hover { background: #e0d9cc; }
  button.danger { background: #fbeae8; color: var(--danger); }
  button.danger:hover { background: #f5d6d2; }
  button.wide { width: 100%; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input, textarea {
    font: inherit;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
  }
  textarea { min-height: 130px; resize: vertical; }
  .hint { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .form-buttons { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .form-buttons button { flex: 1; }

  /* Heading with a button on the right */
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .section-head h2 { margin: 0; }
  .section-head button { flex-shrink: 0; }

  /* The add / edit form inside «Mine middager» */
  .form-box {
    background: #f6f1e8;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
    scroll-margin-top: 12px;
  }
  .form-box h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .form-box label:first-of-type { margin-top: 8px; }

  /* Picture picker in the form */
  .photo-picker { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .photo-preview {
    width: 96px; height: 96px; object-fit: cover;
    border-radius: 12px; border: 1px solid var(--border);
  }
  .photo-buttons { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
  .photo-buttons button { flex: 1; min-width: 150px; }

  /* Small dinner pictures (thumbnails) */
  .thumb {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 10px;
    object-fit: cover;
    background: #f1ece3;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
  }
  .thumb.big { width: 72px; height: 72px; font-size: 2rem; border-radius: 12px; }

  .week { list-style: none; padding: 0; margin: 16px 0 0; }
  .week li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 8px;
    border-top: 1px solid var(--border);
    border-radius: 8px;
  }
  .week li.locked { background: #eef6f1; }
  .week .day { font-weight: 700; width: 100px; flex-shrink: 0; color: var(--accent); }
  .week .meal { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .week .lock {
    flex-shrink: 0;
    min-width: 48px;
    padding: 8px 10px;
    font-size: 1.2rem;
    background: #ece7de;
  }
  .week .lock:hover { background: #e0d9cc; }
  .week li.locked .lock { background: var(--accent); }
  .week li.locked .lock:hover { background: var(--accent-dark); }
  .week .lock .icon { display: inline-block; }
  /* Locking: the padlock squeezes shut and pops back with a little click */
  .week .lock.anim-lock .icon { animation: lockShut 0.45s ease-out; }
  @keyframes lockShut {
    0%   { transform: scale(1) translateY(0); }
    30%  { transform: scale(1.25, 0.8) translateY(3px); }
    60%  { transform: scale(0.9, 1.15) translateY(-2px); }
    100% { transform: scale(1) translateY(0); }
  }
  /* Unlocking: the padlock jumps up and wiggles open */
  .week .lock.anim-unlock .icon { animation: lockOpen 0.5s ease-out; }
  @keyframes lockOpen {
    0%   { transform: translateY(0) rotate(0); }
    25%  { transform: translateY(-5px) rotate(-15deg); }
    50%  { transform: translateY(-3px) rotate(10deg); }
    75%  { transform: translateY(0) rotate(-5deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .week .lock .icon { animation: none !important; }
  }
  .empty { color: var(--muted); font-style: italic; }

  /* Heading that folds a section open and closed */
  .collapse-toggle {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    background: none; color: inherit;
    font-size: inherit; font-weight: inherit;
    padding: 4px 0; text-align: left;
  }
  .collapse-toggle:hover { background: none; color: var(--accent); }
  .collapse-toggle .arrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 10px;
    background: #ece7de; font-size: 1.1rem;
    transition: transform 0.2s ease;
  }
  .collapse-toggle[aria-expanded="false"] .arrow { transform: rotate(-90deg); }
  h2:has(.collapse-toggle[aria-expanded="false"]) { margin-bottom: 0; }

  .dinner {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
  }
  .dinner-top { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
  .dinner-top .info { flex: 1; min-width: 0; }
  .dinner h3 { margin: 0 0 6px; font-size: 1.1rem; }
  .dinner p { margin: 0; color: var(--muted); }
  .dinner .actions { display: flex; gap: 10px; }
  .dinner .actions button { flex: 1; }

  .category-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 18px 0 4px;
  }
  .category-title:first-child { margin-top: 0; }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .item label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    padding: 10px 4px;
    font-weight: 400;
    cursor: pointer;
    min-height: 48px;
  }
  .item input[type="checkbox"] {
    width: 26px;
    height: 26px;
    padding: 0;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .item .count { color: var(--muted); font-size: 0.9rem; }
  .item.checked .name { text-decoration: line-through; color: var(--muted); }
  .item select {
    font: inherit;
    font-size: 0.9rem;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    max-width: 45%;
  }

  @media (max-width: 480px) {
    .week li { gap: 8px; }
    .week .day { width: 72px; }
    .week .thumb { width: 40px; height: 40px; }
  }
</style>
</head>
<body>
<main>
  <h1>Middagsplanlegger</h1>
  <p class="subtitle">Lagre middagene dine og la siden planlegge uka for deg.</p>

  <!-- Week plan -->
  <section>
    <h2>Denne uka</h2>
    <button class="wide" id="pickWeekBtn">🎲 Velg ukas middager</button>
    <div class="hint">Trykk på 🔓 for å låse en middag du liker. Når du velger på nytt, endres bare de ulåste dagene.</div>
    <ul class="week" id="weekList"></ul>
  </section>

  <!-- Shopping list -->
  <section>
    <h2>
      <button class="collapse-toggle" id="shoppingToggle" aria-expanded="true" aria-controls="shoppingBody">
        <span>Handleliste</span>
        <span class="arrow" aria-hidden="true">▾</span>
      </button>
    </h2>
    <div id="shoppingBody">
      <div id="shoppingList"></div>
      <div class="form-buttons" id="shoppingButtons">
        <button class="secondary" id="clearTicksBtn">Fjern alle haker</button>
        <button class="secondary" id="editCategoriesBtn">Endre kategorier</button>
      </div>
    </div>
  </section>

  <!-- Saved dinners, with the add / edit form -->
  <section>
    <div class="section-head">
      <h2>Mine middager (<span id="dinnerCount">0</span>)</h2>
      <button id="addDinnerBtn">＋ Legg til</button>
    </div>

    <div class="form-box" id="formBox" hidden>
    <h3 id="formTitle">Legg til middag</h3>
    <form id="dinnerForm">
      <label for="nameInput">Navn på middagen</label>
      <input id="nameInput" type="text" placeholder="f.eks. Fisketaco" required>

      <label for="ingredientsInput">Ingredienser</label>
      <textarea id="ingredientsInput" placeholder="Én ingrediens per linje"></textarea>
      <div class="hint">Skriv én ingrediens på hver linje.</div>

      <label>Bilde</label>
      <div class="photo-picker">
        <img id="photoPreview" class="photo-preview" alt="Bilde av middagen" hidden>
        <div class="photo-buttons">
          <button type="button" class="secondary" id="choosePhotoBtn">📷 Legg til bilde</button>
          <button type="button" class="danger" id="removePhotoBtn" hidden>Fjern bilde</button>
        </div>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </div>

      <div class="form-buttons">
        <button type="submit" id="saveBtn">Lagre</button>
        <button type="button" class="secondary" id="cancelBtn">Avbryt</button>
      </div>
    </form>
    </div>

    <div id="dinnerList"></div>
  </section>
</main>

<script>
  // ---------- Saved data ----------
  const DINNERS_KEY = "dinnerPlanner.dinners";
  const WEEK_KEY = "dinnerPlanner.week";
  const LOCKED_KEY = "dinnerPlanner.locked";
  const CHECKED_KEY = "dinnerPlanner.checked";
  const MY_CATEGORIES_KEY = "dinnerPlanner.myCategories";

  // Shopping list categories, in the order they are shown (like walking through a shop)
  const CATEGORY_ORDER = [
    "Fruit & vegetables", "Bread & bakery", "Meat & fish", "Dairy & eggs",
    "Dry goods", "Spices & sauces", "Frozen", "Other"
  ];

  // The names shown on the page for each category
  // (the English names above are only used behind the scenes, so saved choices keep working)
  const CATEGORY_LABELS = {
    "Fruit & vegetables": "Frukt og grønt",
    "Bread & bakery": "Brød og bakevarer",
    "Meat & fish": "Kjøtt og fisk",
    "Dairy & eggs": "Meieri og egg",
    "Dry goods": "Tørrvarer",
    "Spices & sauces": "Krydder og sauser",
    "Frozen": "Frysevarer",
    "Other": "Annet"
  };

  // Words used to guess an ingredient's category (Norwegian and English).
  // A word matches if it is at the start or the end of a word in the ingredient,
  // so "løk" matches both "løk" and "purreløk".
  // Checked from top to bottom, and the first match wins
  // (so "kokosmelk" becomes Dry goods before "melk" can make it Dairy).
  const CATEGORY_WORDS = [
    ["Spices & sauces", ["paprikapulver", "chilipulver", "chili powder"]],
    ["Fruit & vegetables", ["paprika", "bell pepper", "sweet pepper", "red pepper", "green pepper", "eggplant"]],
    ["Meat & fish", ["kjøttdeig", "kjøttboller", "kjøttkaker", "sausage"]],
    ["Dairy & eggs", ["goat cheese"]],
    ["Frozen", ["frossen", "frosne", "fryst", "fiskepinne", "iskrem", "pommes frites",
      "frozen", "fish finger", "ice cream"]],
    ["Spices & sauces", ["krydder", "salt", "pepper", "saus", "sennep", "majones", "remulade", "remoulade", "dressing",
      "soya", "eddik", "olje", "ketsjup", "ketchup", "pesto", "salsa", "karri", "curry", "kanel", "oregano",
      "spice", "seasoning", "sauce", "paste", "mustard", "mayo", "soy", "vinegar", "oil", "cumin",
      "cinnamon"]],
    ["Dry goods", ["hermetisk", "buljong", "kokosmelk", "pasta", "spagetti", "spaghetti", "makaroni",
      "nudler", "lasagneplater", "ris", "hvetemel", "maismel", "sukker", "tacoskjell", "tortilla", "linser",
      "kikerter", "havregryn", "nøtter", "potetgull",
      "canned", "tinned", "stock", "broth", "coconut milk", "macaroni", "noodle", "lasagne", "lasagna",
      "rice", "flour", "sugar", "taco shell", "lentil", "chickpea", "kidney bean", "oat", "cereal", "nuts",
      "crisps"]],
    ["Bread & bakery", ["brød", "deig", "rundstykke", "bolle", "baguette", "pita", "lompe", "lefse",
      "bread", "dough", "bun", "naan", "wrap"]],
    ["Meat & fish", ["kjøtt", "storfe", "svin", "kylling", "kalkun", "lam", "bacon", "skinke", "pølse",
      "salami", "biff", "fisk", "laks", "torsk", "sei", "tunfisk", "reke", "scampi", "blåskjell", "filet",
      "karbonade", "ribbe",
      "beef", "mince", "pork", "chicken", "turkey", "ham", "meat", "steak", "fish", "salmon", "cod",
      "tuna", "shrimp", "prawn", "mussel", "fillet"]],
    ["Dairy & eggs", ["melk", "fløte", "ost", "smør", "yoghurt", "egg", "rømme", "crème fraîche",
      "creme fraiche", "mozzarella", "parmesan", "feta", "cottage", "margarin", "kesam",
      "milk", "cream", "cheese", "butter", "yogurt"]],
    ["Fruit & vegetables", ["løk", "purre", "potet", "gulrot", "gulrøtter", "tomat", "salat", "agurk",
      "brokkoli", "kål", "sitron", "lime", "eple", "banan", "sopp", "sjampinjong", "champignon", "erter", "spinat",
      "avokado", "mais", "squash", "ingefær", "persille", "koriander", "basilikum", "selleri", "bær",
      "frukt", "grønnsak", "gresskar", "appelsin", "druer", "bønne",
      "onion", "garlic", "potato", "carrot", "tomato", "lettuce", "salad", "cucumber", "broccoli", "leek",
      "lemon", "apple", "banana", "mushroom", "pea", "spinach", "cabbage", "cauliflower", "avocado",
      "corn", "zucchini", "courgette", "ginger", "herb", "parsley", "coriander", "basil", "celery", "bean",
      "berr", "fruit", "vegetable", "pumpkin", "chili", "orange"]]
  ];
  const DAYS = ["Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag", "Søndag"];

  const EXAMPLE_DINNERS = [
    { name: "Spagetti bolognese", ingredients: ["Spagetti", "Kjøttdeig", "Løk", "Hvitløk", "Hermetiske tomater", "Parmesan"] },
    { name: "Taco", ingredients: ["Tacoskjell", "Kjøttdeig", "Tacokrydder", "Isbergsalat", "Tomater", "Revet ost", "Rømme"] },
    { name: "Laks med poteter", ingredients: ["Laksefilet", "Poteter", "Brokkoli", "Sitron", "Smør"] },
    { name: "Kyllingcurry", ingredients: ["Kyllingfilet", "Currypasta", "Kokosmelk", "Løk", "Ris"] },
    { name: "Hjemmelaget pizza", ingredients: ["Pizzadeig", "Tomatsaus", "Mozzarella", "Skinke", "Sjampinjong"] },
    { name: "Grønnsakssuppe", ingredients: ["Gulrøtter", "Poteter", "Purreløk", "Løk", "Grønnsaksbuljong", "Brød"] },
    { name: "Fiskepinner", ingredients: ["Fiskepinner", "Poteter", "Erter", "Remulade"] },
    { name: "Omelett med salat", ingredients: ["Egg", "Melk", "Ost", "Skinke", "Isbergsalat", "Agurk"] }
  ];

  // The old English example dinners, in the same order as above.
  // If you still have one of these unchanged, it is swapped for the Norwegian version.
  const OLD_ENGLISH_EXAMPLES = [
    { name: "Spaghetti Bolognese", ingredients: ["Spaghetti", "Minced beef", "Onion", "Garlic", "Canned tomatoes", "Parmesan"] },
    { name: "Tacos", ingredients: ["Taco shells", "Minced beef", "Taco spice", "Lettuce", "Tomatoes", "Cheese", "Sour cream"] },
    { name: "Salmon with potatoes", ingredients: ["Salmon fillets", "Potatoes", "Broccoli", "Lemon", "Butter"] },
    { name: "Chicken curry", ingredients: ["Chicken breast", "Curry paste", "Coconut milk", "Onion", "Rice"] },
    { name: "Homemade pizza", ingredients: ["Pizza dough", "Tomato sauce", "Mozzarella", "Ham", "Mushrooms"] },
    { name: "Vegetable soup", ingredients: ["Carrots", "Potatoes", "Leek", "Onion", "Vegetable stock", "Bread"] },
    { name: "Fish fingers", ingredients: ["Fish fingers", "Potatoes", "Peas", "Remoulade"] },
    { name: "Omelette with salad", ingredients: ["Eggs", "Milk", "Cheese", "Ham", "Lettuce", "Cucumber"] }
  ];

  function translateOldExamples(list) {
    list.forEach(dinner => {
      const i = OLD_ENGLISH_EXAMPLES.findIndex(old =>
        old.name === dinner.name && old.ingredients.join("|") === dinner.ingredients.join("|"));
      if (i !== -1) {
        dinner.name = EXAMPLE_DINNERS[i].name;
        dinner.ingredients = EXAMPLE_DINNERS[i].ingredients.slice();
      }
    });
    return list;
  }

  function loadDinners() {
    try {
      const saved = localStorage.getItem(DINNERS_KEY);
      if (saved) return translateOldExamples(JSON.parse(saved));
    } catch (e) {}
    // First visit: start with example dinners
    return EXAMPLE_DINNERS.map(d => ({ id: makeId(), name: d.name, ingredients: d.ingredients.slice() }));
  }

  function loadWeek() {
    try {
      const saved = localStorage.getItem(WEEK_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return [];
  }

  function loadLocked() {
    try {
      const saved = localStorage.getItem(LOCKED_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return [false, false, false, false, false, false, false];
  }

  function loadSaved(key, fallback) {
    try {
      const saved = localStorage.getItem(key);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return fallback;
  }

  function save() {
    try {
      localStorage.setItem(DINNERS_KEY, JSON.stringify(dinners));
      localStorage.setItem(WEEK_KEY, JSON.stringify(week));
      localStorage.setItem(LOCKED_KEY, JSON.stringify(locked));
      localStorage.setItem(CHECKED_KEY, JSON.stringify(checked));
      localStorage.setItem(MY_CATEGORIES_KEY, JSON.stringify(myCategories));
    } catch (e) {
      alert("Beklager, middagene kunne ikke lagres i denne nettleseren.");
    }
  }

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  let dinners = loadDinners();
  let week = loadWeek();     // list of 7 dinner ids, Monday to Sunday
  let locked = loadLocked(); // 7 true/false values: is that day locked?
  let checked = loadSaved(CHECKED_KEY, []);           // ingredients ticked off in the shopping list
  let myCategories = loadSaved(MY_CATEGORIES_KEY, {}); // categories you chose yourself
  let editingCategories = false;
  let editingId = null;      // id of the dinner being edited, or null when adding
  save();

  // ---------- Page elements ----------
  const form = document.getElementById("dinnerForm");
  const nameInput = document.getElementById("nameInput");
  const ingredientsInput = document.getElementById("ingredientsInput");
  const formTitle = document.getElementById("formTitle");
  const saveBtn = document.getElementById("saveBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const dinnerList = document.getElementById("dinnerList");
  const dinnerCount = document.getElementById("dinnerCount");
  const weekList = document.getElementById("weekList");
  const pickWeekBtn = document.getElementById("pickWeekBtn");

  // Makes text safe to show on the page
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // A small picture of the dinner, or a plate icon if it has no picture
  function thumbHtml(dinner, size) {
    const cls = `thumb ${size || ""}`;
    if (dinner && dinner.photo) return `<img class="${cls}" src="${escapeAttr(dinner.photo)}" alt="">`;
    return `<span class="${cls}" aria-hidden="true">🍽️</span>`;
  }

  // ---------- Show dinners ----------
  function renderDinners() {
    dinnerCount.textContent = dinners.length;
    if (dinners.length === 0) {
      dinnerList.innerHTML = '<p class="empty">Ingen middager ennå. Legg til din første over.</p>';
      return;
    }
    const sorted = dinners.slice().sort((a, b) => a.name.localeCompare(b.name, "nb"));
    dinnerList.innerHTML = sorted.map(d => `
      <div class="dinner">
        <div class="dinner-top">
          ${thumbHtml(d, "big")}
          <div class="info">
            <h3>${escapeHtml(d.name)}</h3>
            <p>${d.ingredients.length ? d.ingredients.map(escapeHtml).join(", ") : "Ingen ingredienser lagt til"}</p>
          </div>
        </div>
        <div class="actions">
          <button class="secondary" data-edit="${d.id}">Rediger</button>
          <button class="danger" data-delete="${d.id}">Slett</button>
        </div>
      </div>
    `).join("");
  }

  // ---------- Show the week ----------
  function renderWeek() {
    if (week.length === 0) {
      weekList.innerHTML = '<li class="empty">Trykk «Velg ukas middager» for å få 7 middager.</li>';
      renderShopping();
      return;
    }
    weekList.innerHTML = DAYS.map((day, i) => {
      const dinner = dinners.find(d => d.id === week[i]);
      const name = dinner ? escapeHtml(dinner.name) : '<span class="empty">(middagen er slettet)</span>';
      const isLocked = locked[i] && dinner;
      const lockText = `${isLocked ? "Lås opp" : "Lås"} ${day.toLowerCase()}`;
      return `<li class="${isLocked ? "locked" : ""}">
        <span class="day">${day}</span>
        ${thumbHtml(dinner)}
        <span class="meal">${name}</span>
        <button class="lock" data-day="${i}" title="${lockText}"
          aria-label="${lockText}"><span class="icon">${isLocked ? "🔒" : "🔓"}</span></button>
      </li>`;
    }).join("");
    renderShopping();
  }

  // ---------- Shopping list ----------
  const shoppingList = document.getElementById("shoppingList");
  const shoppingButtons = document.getElementById("shoppingButtons");
  const clearTicksBtn = document.getElementById("clearTicksBtn");
  const editCategoriesBtn = document.getElementById("editCategoriesBtn");

  // Makes text safe to put inside an HTML attribute
  function escapeAttr(text) {
    return escapeHtml(text).replace(/"/g, "&quot;");
  }

  // Guess the category from words in the ingredient name
  function guessCategory(key) {
    const parts = key.split(/[^a-zæøåéèêëîïôûüç]+/);
    for (const [category, words] of CATEGORY_WORDS) {
      for (const word of words) {
        if (word.includes(" ")) {
          // Phrases like "coconut milk" must start at the beginning of a word
          const start = key.indexOf(word);
          if (start !== -1 && (start === 0 || !/[a-zæøå]/.test(key[start - 1]))) return category;
        } else if (parts.some(part => part.startsWith(word) || part.endsWith(word))) {
          return category;
        }
      }
    }
    return "Other";
  }

  function categoryOf(key) {
    return myCategories[key] || guessCategory(key);
  }

  // Collect all ingredients from the week, combining duplicates
  function getShoppingItems() {
    const items = new Map();
    week.forEach(id => {
      const dinner = dinners.find(d => d.id === id);
      if (!dinner) return;
      dinner.ingredients.forEach(ingredient => {
        const name = ingredient.trim();
        const key = name.toLowerCase();
        if (!key) return;
        if (!items.has(key)) items.set(key, { key, name, count: 0 });
        items.get(key).count++;
      });
    });
    return [...items.values()];
  }

  function renderShopping() {
    const items = getShoppingItems();
    shoppingButtons.hidden = items.length === 0;
    if (items.length === 0) {
      shoppingList.innerHTML = '<p class="empty">Velg ukas middager for å se handlelisten.</p>';
      return;
    }

    // Forget ticks for ingredients that are no longer on the list
    const stillNeeded = checked.filter(key => items.some(item => item.key === key));
    if (stillNeeded.length !== checked.length) {
      checked = stillNeeded;
      save();
    }

    let html = "";
    CATEGORY_ORDER.forEach(category => {
      const inCategory = items
        .filter(item => categoryOf(item.key) === category)
        .sort((a, b) => {
          // Not-ticked items first, then ticked items at the bottom
          const tickDiff = checked.includes(a.key) - checked.includes(b.key);
          return tickDiff || a.name.localeCompare(b.name, "nb");
        });
      if (inCategory.length === 0) return;

      html += `<h3 class="category-title">${CATEGORY_LABELS[category]}</h3>`;
      inCategory.forEach(item => {
        const isChecked = checked.includes(item.key);
        const options = CATEGORY_ORDER.map(c =>
          `<option value="${c}" ${c === category ? "selected" : ""}>${CATEGORY_LABELS[c]}</option>`).join("");
        html += `
          <div class="item ${isChecked ? "checked" : ""}">
            <label>
              <input type="checkbox" data-key="${escapeAttr(item.key)}" ${isChecked ? "checked" : ""}>
              <span class="name">${escapeHtml(item.name)}</span>
              ${item.count > 1 ? `<span class="count">×${item.count}</span>` : ""}
            </label>
            ${editingCategories
              ? `<select data-key="${escapeAttr(item.key)}" aria-label="Kategori for ${escapeAttr(item.name)}">${options}</select>`
              : ""}
          </div>`;
      });
    });
    shoppingList.innerHTML = html;
  }

  // Tick an item, or change its category
  shoppingList.addEventListener("change", (event) => {
    const key = event.target.dataset.key;
    if (!key) return;
    if (event.target.type === "checkbox") {
      if (event.target.checked) {
        checked.push(key);
      } else {
        checked = checked.filter(k => k !== key);
      }
    } else if (event.target.tagName === "SELECT") {
      myCategories[key] = event.target.value;
    }
    save();
    renderShopping();
  });

  // Fold the shopping list open or closed (remembered for next time)
  const SHOPPING_OPEN_KEY = "dinnerPlanner.shoppingOpen";
  const shoppingToggle = document.getElementById("shoppingToggle");
  const shoppingBody = document.getElementById("shoppingBody");
  function showShoppingOpen(open) {
    shoppingBody.hidden = !open;
    shoppingToggle.setAttribute("aria-expanded", open);
    shoppingToggle.title = open ? "Skjul handlelisten" : "Vis handlelisten";
  }
  showShoppingOpen(loadSaved(SHOPPING_OPEN_KEY, true));
  shoppingToggle.addEventListener("click", () => {
    const open = shoppingBody.hidden; // it was closed, so now open it (and the other way round)
    showShoppingOpen(open);
    try { localStorage.setItem(SHOPPING_OPEN_KEY, JSON.stringify(open)); } catch (e) {}
  });

  clearTicksBtn.addEventListener("click", () => {
    checked = [];
    save();
    renderShopping();
  });

  editCategoriesBtn.addEventListener("click", () => {
    editingCategories = !editingCategories;
    editCategoriesBtn.textContent = editingCategories ? "Ferdig" : "Endre kategorier";
    renderShopping();
  });

  // ---------- Lock / unlock a day ----------
  weekList.addEventListener("click", (event) => {
    const button = event.target.closest(".lock");
    if (!button) return;
    const i = Number(button.dataset.day);
    locked[i] = !locked[i];
    save();
    renderWeek();
    // Play the open/close animation on the button that was tapped
    const newButton = weekList.querySelector(`.lock[data-day="${i}"]`);
    if (newButton) newButton.classList.add(locked[i] ? "anim-lock" : "anim-unlock");
  });

  // ---------- Pick 7 random dinners ----------
  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  pickWeekBtn.addEventListener("click", () => {
    if (dinners.length === 0) {
      alert("Legg til noen middager først.");
      return;
    }
    // A day stays the same only if it is locked and its dinner still exists
    const keep = DAYS.map((_, i) =>
      locked[i] && dinners.some(d => d.id === week[i]) ? week[i] : null);
    const openDays = keep.filter(id => id === null).length;

    // Fill open days with dinners not already locked in, if there are enough.
    // With too few dinners, some will repeat.
    const notUsed = dinners.filter(d => !keep.includes(d.id));
    let picked = shuffle(notUsed);
    while (picked.length < openDays) {
      picked = picked.concat(shuffle(dinners));
    }
    week = keep.map(id => id !== null ? id : picked.shift().id);
    locked = keep.map(id => id !== null);
    save();
    renderWeek();
  });

  // ---------- Picture for a dinner ----------
  const photoInput = document.getElementById("photoInput");
  const photoPreview = document.getElementById("photoPreview");
  const choosePhotoBtn = document.getElementById("choosePhotoBtn");
  const removePhotoBtn = document.getElementById("removePhotoBtn");
  const PHOTO_SIZE = 240; // pictures are shrunk to a 240×240 square so they take little space
  let formPhoto = null;   // the picture currently chosen in the form, or null

  function showFormPhoto() {
    photoPreview.hidden = !formPhoto;
    if (formPhoto) photoPreview.src = formPhoto;
    else photoPreview.removeAttribute("src");
    removePhotoBtn.hidden = !formPhoto;
    choosePhotoBtn.textContent = formPhoto ? "📷 Bytt bilde" : "📷 Legg til bilde";
  }

  // Shrinks a picture to a small square (cut from the middle) and returns it as text that can be saved
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = PHOTO_SIZE;
        canvas.getContext("2d").drawImage(img,
          (img.width - side) / 2, (img.height - side) / 2, side, side,
          0, 0, PHOTO_SIZE, PHOTO_SIZE);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }

  choosePhotoBtn.addEventListener("click", () => photoInput.click());

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files[0];
    photoInput.value = ""; // so the same picture can be chosen again later
    if (!file) return;
    try {
      formPhoto = await shrinkPhoto(file);
      showFormPhoto();
    } catch (e) {
      alert("Beklager, dette bildet kunne ikke åpnes. Prøv et annet bilde.");
    }
  });

  removePhotoBtn.addEventListener("click", () => {
    formPhoto = null;
    showFormPhoto();
  });

  // ---------- Add / edit form ----------
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;
    const ingredients = ingredientsInput.value
      .split("\n")
      .map(line => line.trim())
      .filter(line => line !== "");

    if (editingId) {
      const dinner = dinners.find(d => d.id === editingId);
      if (dinner) {
        dinner.name = name;
        dinner.ingredients = ingredients;
        if (formPhoto) dinner.photo = formPhoto;
        else delete dinner.photo;
      }
    } else {
      const dinner = { id: makeId(), name, ingredients };
      if (formPhoto) dinner.photo = formPhoto;
      dinners.push(dinner);
    }
    save();
    resetForm();
    renderDinners();
    renderWeek();
  });

  cancelBtn.addEventListener("click", resetForm);

  // Show the form inside «Mine middager» and jump to it
  const formBox = document.getElementById("formBox");
  const addDinnerBtn = document.getElementById("addDinnerBtn");
  function openForm() {
    formBox.hidden = false;
    addDinnerBtn.hidden = true;
    formBox.scrollIntoView({ behavior: "smooth", block: "start" });
    nameInput.focus({ preventScroll: true });
  }

  addDinnerBtn.addEventListener("click", () => {
    resetForm();
    openForm();
  });

  // Empty the form and fold it away
  function resetForm() {
    editingId = null;
    form.reset();
    formPhoto = null;
    showFormPhoto();
    formTitle.textContent = "Legg til middag";
    saveBtn.textContent = "Lagre";
    formBox.hidden = true;
    addDinnerBtn.hidden = false;
  }

  function startEditing(id) {
    const dinner = dinners.find(d => d.id === id);
    if (!dinner) return;
    editingId = id;
    nameInput.value = dinner.name;
    ingredientsInput.value = dinner.ingredients.join("\n");
    formPhoto = dinner.photo || null;
    showFormPhoto();
    formTitle.textContent = "Rediger middag";
    saveBtn.textContent = "Lagre endringer";
    openForm();
  }

  // ---------- Edit and delete buttons ----------
  dinnerList.addEventListener("click", (event) => {
    const editId = event.target.dataset.edit;
    const deleteId = event.target.dataset.delete;
    if (editId) startEditing(editId);
    if (deleteId) {
      const dinner = dinners.find(d => d.id === deleteId);
      if (dinner && confirm(`Slette «${dinner.name}»?`)) {
        dinners = dinners.filter(d => d.id !== deleteId);
        if (editingId === deleteId) resetForm();
        save();
        renderDinners();
        renderWeek();
      }
    }
  });

  renderDinners();
  renderWeek();
</script>
</body>
</html>
